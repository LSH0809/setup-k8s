---
all:
  children:
    masters:
      hosts:
        master:
          ansible_host: YOUR_MASTER_IP
    workers:
      hosts:
        worker1:
          ansible_host: YOUR_WORKER1_IP
        worker2:
          ansible_host: YOUR_WORKER2_IP
  vars:
    ansible_user: YOUR_SSH_USER
    ansible_ssh_private_key_file: ~/.ssh/id_rsa 